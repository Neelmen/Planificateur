name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Cette ligne est TRÈS importante pour tester

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Envoi d'une requête de lecture à Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/companies?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -I

      - name: Vérification du fonctionnement
        run: echo "Le ping Supabase a été envoyé avec succès !"
