name: Supabase Keep-Alive

on:
  schedule:
    # S'exécute automatiquement tous les 5 jours à minuit
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Permet de déclencher le script manuellement depuis l'interface GitHub

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Envoi d'une requête de lecture à Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/companies?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -I
